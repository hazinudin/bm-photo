[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bm-photo-client"
version = "0.1.0"
description = "Python client for Bina Marga Survey Photo Service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[project.urls]
Repository = "https://github.com/bina-marga/survey-photo"

[tool.hatch.build.targets.wheel]
packages = ["src/bm_photo_client"]

[tool.hatch.build.targets.sdist]
include = ["src/bm_photo_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
