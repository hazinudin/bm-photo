apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bm-photo-hpa
  namespace: bm-photo
  labels:
    app.kubernetes.io/name: bm-photo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bm-photo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
